<!-- ============================================================
  Setup-Diagnose-Tool — Christian Seitz
  Interaktiver Selector: Phase + Symptom → konkrete Hebel + Fundort im Spiel.
  Gleiches Design-System wie setup-guide.html (dunkle Timing-Tower-Ästhetik).
  Eigenständige Datei — auf der Website hostbar und aus Discord verlinkbar
  (Discord kann selbst kein interaktives HTML ausführen).
============================================================= -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup-Diagnose — Christian Seitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E13;
    --surface:#121821;
    --surface-2:#1A2430;
    --border:#26323F;
    --text:#E7ECF1;
    --text-muted:#8FA0AF;
    --teal:#23D2B5;
    --amber:#EFA23B;
    --rose:#F26E82;
    --font-display:'Saira Condensed', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:56px 24px 80px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;}

  .eyebrow{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .eyebrow .dot{width:6px;height:6px;background:var(--teal);border-radius:50%;flex:none;}
  h1{font-size:clamp(2rem,4.5vw,2.8rem);line-height:1.1;max-width:15ch;}
  .sub{color:var(--text-muted);max-width:52ch;margin-top:16px;font-size:1rem;}

  .step{margin-top:44px;}
  .step-label{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-muted);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .step-label .n{width:20px;height:20px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text);flex:none;}

  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);}
  .choices.two{grid-template-columns:repeat(2,1fr);}
  .choice{
    background:var(--surface);border:none;color:var(--text);font-family:var(--font-body);
    font-size:0.92rem;text-align:left;padding:18px 16px;cursor:pointer;transition:background 0.12s ease;
  }
  .choice:hover{background:var(--surface-2);}
  .choice.active{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--teal);}
  .choice .t{font-family:var(--font-display);font-weight:600;font-size:1.05rem;display:block;margin-bottom:4px;}
  .choice .d{color:var(--text-muted);font-size:0.82rem;}

  .result{margin-top:44px;display:none;}
  .result.show{display:block;}
  .result-head{
    border:1px solid var(--border);border-top:3px solid var(--rose);background:var(--surface);
    padding:22px 24px;
  }
  .result-head.affirm{border-top-color:var(--rose);}
  .result-head.deny{border-top-color:var(--teal);}
  .result-head h2{font-size:1.4rem;}
  .result-head p{color:var(--text-muted);margin:8px 0 0;font-size:0.92rem;}

  .lever-block{border:1px solid var(--border);border-top:none;background:var(--surface);}
  .lever-group{padding:20px 24px;border-bottom:1px solid var(--border);}
  .lever-group:last-child{border-bottom:none;}
  .lever-group .axle{font-family:var(--font-mono);font-size:0.72rem;color:var(--amber);margin-bottom:10px;}
  .lever-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--surface-2);}
  .lever-item:last-child{border-bottom:none;}
  .lever-item .what{font-size:0.92rem;}
  .lever-item .where{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);white-space:nowrap;}

  .note{
    margin-top:1px;border:1px solid var(--border);border-top:none;border-left:3px solid var(--amber);
    background:var(--surface);padding:16px 24px;font-size:0.88rem;color:var(--text-muted);
  }
  .note strong{color:var(--text);}

  .reset{
    margin-top:24px;font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);
    background:none;border:1px solid var(--border);padding:9px 16px;cursor:pointer;
  }
  .reset:hover{color:var(--text);border-color:var(--text-muted);}

  @media (max-width:560px){
    .choices{grid-template-columns:1fr;}
    .choices.two{grid-template-columns:1fr;}
    .lever-item{grid-template-columns:1fr;gap:2px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow"><span class="dot"></span> Setup-Diagnose</div>
  <h1>Was macht dein Auto — und wo drehst du?</h1>
  <p class="sub">Zwei Klicks: wann im Kurvenverlauf es passiert, und was das Auto dabei macht. Dann die konkreten Hebel plus wo du sie im iRacing-Setup-Screen findest.</p>

  <div class="step">
    <div class="step-label"><span class="n">1</span> Wann passiert es?</div>
    <div class="choices" id="phase-choices">
      <button class="choice" data-phase="entry">
        <span class="t">Einlenken</span>
        <span class="d">unter Bremse / Trail-Braking</span>
      </button>
      <button class="choice" data-phase="mid">
        <span class="t">Kurvenmitte</span>
        <span class="d">neutrale Last, kein Gas/Bremse</span>
      </button>
      <button class="choice" data-phase="exit">
        <span class="t">Kurvenausgang</span>
        <span class="d">unter Gas</span>
      </button>
    </div>
  </div>

  <div class="step">
    <div class="step-label"><span class="n">2</span> Was macht das Auto?</div>
    <div class="choices two" id="symptom-choices">
      <button class="choice" data-symptom="under">
        <span class="t">Untersteuert</span>
        <span class="d">schiebt, dreht nicht genug ein/rum</span>
      </button>
      <button class="choice" data-symptom="over">
        <span class="t">Übersteuert</span>
        <span class="d">bricht aus, Heck kommt</span>
      </button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="result-head" id="result-head">
      <h2 id="result-title"></h2>
      <p id="result-why"></p>
    </div>
    <div class="lever-block" id="result-levers"></div>
    <div class="note" id="result-note"></div>
  </div>

  <button class="reset" id="reset-btn" style="display:none;">Neu starten</button>
</div>

<script>
const DATA = {
  entry: {
    label: "Einlenken / unter Bremse",
    under: {
      title: "Einlenk-Untersteuern — schiebt, dreht nicht ein",
      why: "Die Vorderachse hat unter Bremslast zu wenig relativen Grip gegenüber dem Heck, oder das Diff hält das Auto beim Lupfen/Bremsen zu sehr gerade.",
      groups: [
        { axle: "Front", items: [
          ["Bremsbalance nach hinten verschieben", "Chassis → Front (Brakes)"],
          ["Front-ARB weicher", "Chassis → Front"],
          ["Front-Camber negativer", "Chassis → Front Corners"],
          ["Front-Ride-Height leicht senken", "Chassis → Front"]
        ]},
        { axle: "Heck / Diff", items: [
          ["Heck-ARB härter", "Chassis → Rear"],
          ["Heck-Toe leicht reduzieren", "Chassis → Rear Corners"],
          ["Coast Ramp öffnen, falls vorhanden", "Gears / Differential"]
        ]}
      ],
      note: "Wird oft mit dem Diff verwechselt — bei Autos ohne separate Coast Ramp greift hier vor allem die Bremsbalance, nicht das Preload."
    },
    over: {
      title: "Einlenk-Übersteuern — Gegenlenk-Schlag (Snap)",
      why: "Die Vorderachse hält zu gut, das Heck bricht relativ dazu unter Bremslast aus, oder das Diff lässt beim Lupfen/Bremsen zu viel Freilauf zu.",
      groups: [
        { axle: "Front", items: [
          ["Bremsbalance nach vorne verschieben", "Chassis → Front (Brakes)"],
          ["Front-ARB härter", "Chassis → Front"],
          ["Front-Ride-Height leicht anheben", "Chassis → Front"],
          ["Front-Toe Richtung neutral", "Chassis → Front Corners"]
        ]},
        { axle: "Heck / Diff", items: [
          ["Heck-ARB weicher", "Chassis → Rear"],
          ["Heck-Toe-in erhöhen", "Chassis → Rear Corners"],
          ["Coast Ramp schließen, falls vorhanden", "Gears / Differential"]
        ]}
      ],
      note: "Bevor du am Diff drehst: prüfen, ob das Auto auch beim reinen Geradeausbremsen schon unruhig ist, oder erst beim Einlenken unter Bremse (Trail-Braking) — das zeigt, ob Bremsbalance oder Coast Ramp der richtige Hebel ist."
    }
  },
  mid: {
    label: "Kurvenmitte (neutrale Last)",
    under: {
      title: "Kurvenmitte-Untersteuern — schiebt über die Vorderachse",
      why: "Die Vorderachse trägt relativ zum Heck zu wenig von der Querlast — meist ARB- oder Ride-Height-Balance.",
      groups: [
        { axle: "Front", items: [
          ["Front-ARB weicher", "Chassis → Front"],
          ["Front-Feder weicher (später Hebel)", "Chassis → Front Corners"],
          ["Front-Ride-Height leicht senken", "Chassis → Front"]
        ]},
        { axle: "Heck", items: [
          ["Heck-ARB härter", "Chassis → Rear"],
          ["Heck-Ride-Height leicht anheben", "Chassis → Rear"]
        ]}
      ],
      note: "Reifendruck ist hier kein Hebel — in iRacing steht der bei GT3 ohnehin auf Minimum."
    },
    over: {
      title: "Kurvenmitte-Übersteuern — Heck bricht ohne Gas/Bremse aus",
      why: "Kein Gas, keine Bremse, und das Heck rotiert trotzdem von selbst — nach der Grundphilosophie ein Alarmsignal, das Setup ist zu drehfreudig eingestellt.",
      groups: [
        { axle: "Front", items: [
          ["Front-ARB härter", "Chassis → Front"]
        ]},
        { axle: "Heck", items: [
          ["Heck-ARB weicher", "Chassis → Rear"],
          ["Heck-Camber weniger negativ", "Chassis → Rear Corners"],
          ["Heck-Ride-Height leicht senken", "Chassis → Rear"]
        ]}
      ],
      note: "Das hier zuerst fixen, auch wenn Einlenken und Exit sich sonst gut anfühlen — ein Auto, das ohne Fahrereingabe dreht, verletzt die Grundphilosophie (Rotation nur über die Bremse)."
    }
  },
  exit: {
    label: "Kurvenausgang / unter Gas",
    under: {
      title: "Exit-Untersteuern — keine Traktion, läuft weit",
      why: "Das Diff ist zu fest gesperrt und kämpft gegen den noch anliegenden Lenkwinkel, oder das Heck hat schlicht zu wenig Grip unter Last.",
      groups: [
        { axle: "Diff", items: [
          ["Preload / Power Ramp öffnen", "Gears / Differential"],
          ["Friction Faces reduzieren, falls vorhanden", "Gears / Differential"]
        ]},
        { axle: "Heck", items: [
          ["Heck-Ride-Height leicht anheben", "Chassis → Rear"],
          ["Heck-ARB weicher", "Chassis → Rear"]
        ]}
      ],
      note: "Diff-Änderungen immer über mehrere Kurventypen gegenprüfen — eine Lockerung, die hier hilft, kann in einer anderen Kurve neues Power-Oversteer erzeugen."
    },
    over: {
      title: "Exit-Übersteuern — Power-Oversteer",
      why: "Das Diff sperrt zu wenig unter Gas, das kurveninnere Rad dreht durch und das Heck bricht weg. Häufigstes Exit-Problem in GT3.",
      groups: [
        { axle: "Diff", items: [
          ["Preload / Power Ramp erhöhen — Haupt-Hebel", "Gears / Differential"],
          ["Friction Faces erhöhen, falls vorhanden", "Gears / Differential"]
        ]},
        { axle: "Heck", items: [
          ["Heck-Toe-in leicht erhöhen", "Chassis → Rear Corners"],
          ["Heck-Camber weniger negativ", "Chassis → Rear Corners"],
          ["Heck-Ride-Height leicht senken, falls Diff allein nicht reicht", "Chassis → Rear"],
          ["TC-Stufe prüfen, falls Reglement erlaubt", "In-Car Dials"]
        ]}
      ],
      note: "Ein zu fest gesperrtes Diff kann in einer anderen Kurve Traktionsverlust oder sogar Einlenk-Probleme erzeugen — nicht isoliert an der einen Stelle testen, sondern über die ganze Runde."
    }
  }
};

let phase = null, symptom = null;

function render(){
  document.querySelectorAll('#phase-choices .choice').forEach(function(b){
    b.classList.toggle('active', b.dataset.phase === phase);
  });
  document.querySelectorAll('#symptom-choices .choice').forEach(function(b){
    b.classList.toggle('active', b.dataset.symptom === symptom);
  });

  const resultEl = document.getElementById('result');
  const resetBtn = document.getElementById('reset-btn');

  if(!phase || !symptom){
    resultEl.classList.remove('show');
    resetBtn.style.display = 'none';
    return;
  }

  const entry = DATA[phase][symptom];
  const head = document.getElementById('result-head');
  head.className = 'result-head ' + (symptom === 'over' ? 'affirm' : 'deny');
  document.getElementById('result-title').textContent = entry.title;
  document.getElementById('result-why').textContent = entry.why;

  const leverBlock = document.getElementById('result-levers');
  leverBlock.innerHTML = '';
  entry.groups.forEach(function(group){
    const g = document.createElement('div');
    g.className = 'lever-group';
    const axle = document.createElement('div');
    axle.className = 'axle';
    axle.textContent = group.axle;
    g.appendChild(axle);
    group.items.forEach(function(item){
      const row = document.createElement('div');
      row.className = 'lever-item';
      const what = document.createElement('span');
      what.className = 'what';
      what.textContent = item[0];
      const where = document.createElement('span');
      where.className = 'where';
      where.textContent = item[1];
      row.appendChild(what);
      row.appendChild(where);
      g.appendChild(row);
    });
    leverBlock.appendChild(g);
  });

  document.getElementById('result-note').innerHTML = '<strong>Dazu:</strong> ' + entry.note;

  resultEl.classList.add('show');
  resetBtn.style.display = 'inline-block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.getElementById('phase-choices').addEventListener('click', function(e){
  const btn = e.target.closest('.choice');
  if(!btn) return;
  phase = btn.dataset.phase;
  render();
});
document.getElementById('symptom-choices').addEventListener('click', function(e){
  const btn = e.target.closest('.choice');
  if(!btn) return;
  symptom = btn.dataset.symptom;
  render();
});
document.getElementById('reset-btn').addEventListener('click', function(){
  phase = null; symptom = null; render();
});
</script>

</body>
</html>
