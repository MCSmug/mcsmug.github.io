<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup-Rechner — Christian Seitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E13;--surface:#121821;--surface-2:#1A2430;--border:#26323F;
    --text:#E7ECF1;--text-muted:#8FA0AF;--teal:#23D2B5;--amber:#EFA23B;--rose:#F26E82;
    --font-display:'Saira Condensed', sans-serif;--font-body:'IBM Plex Sans', sans-serif;--font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:56px 24px 80px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;}

  .eyebrow{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .eyebrow .dot{width:6px;height:6px;background:var(--teal);border-radius:50%;flex:none;}
  h1{font-size:clamp(2rem,4.5vw,2.8rem);line-height:1.1;max-width:16ch;}
  .sub{color:var(--text-muted);max-width:56ch;margin-top:16px;font-size:1rem;}

  .sg-topbar{position:sticky;top:0;z-index:50;background:rgba(10,14,19,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .sg-topbar-inner{max-width:760px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:26px;overflow-x:auto;}
  .sg-topbar .brand{margin-right:auto;font-family:var(--font-display);font-weight:600;color:var(--text);font-size:1rem;text-decoration:none;white-space:nowrap;}
  .sg-topbar a:not(.brand){font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;padding:8px 0;border-bottom:2px solid transparent;white-space:nowrap;}
  .sg-topbar a:not(.brand):hover{color:var(--text);}
  .sg-topbar a.active{color:var(--teal) !important;border-color:var(--teal) !important;}

  .step{margin-top:40px;}
  .step-label{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-muted);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .step-label .n{width:20px;height:20px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text);flex:none;}

  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);}
  .choices.two{grid-template-columns:repeat(2,1fr);}
  .choice{background:var(--surface);border:none;color:var(--text);font-family:var(--font-body);font-size:0.9rem;text-align:left;padding:16px 14px;cursor:pointer;}
  .choice:hover{background:var(--surface-2);}
  .choice.active{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--teal);}
  .choice .t{font-family:var(--font-display);font-weight:600;font-size:1rem;display:block;margin-bottom:2px;}
  .choice .d{color:var(--text-muted);font-size:0.78rem;}

  .result{margin-top:40px;display:none;}
  .result.show{display:block;}
  .result-head{border:1px solid var(--border);border-top:3px solid var(--teal);background:var(--surface);padding:20px 22px;}
  .result-head.affirm{border-top-color:var(--rose);}
  .result-head h2{font-size:1.25rem;}

  .calc-table{border:1px solid var(--border);border-top:none;background:var(--surface);}
  .calc-row{
    display:grid;grid-template-columns:1fr 100px 30px 110px;gap:10px;align-items:center;
    padding:14px 22px;border-bottom:1px solid var(--surface-2);
  }
  .calc-row:last-child{border-bottom:none;}
  .calc-row .lbl{font-size:0.88rem;}
  .calc-row .loc{display:block;font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);margin-top:2px;}
  .calc-row input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-mono);font-size:0.9rem;padding:8px 9px;text-align:right;
  }
  .calc-row input:focus{border-color:var(--teal);outline:none;}
  .calc-row .arrow{text-align:center;color:var(--text-muted);font-family:var(--font-mono);}
  .calc-row .out{font-family:var(--font-mono);font-size:0.95rem;color:var(--teal);font-weight:600;}
  .calc-row .out.empty{color:var(--text-muted);font-weight:400;}
  .calc-row .unit{font-size:0.72rem;color:var(--text-muted);margin-left:3px;}

  .note-row{
    border:1px solid var(--border);border-top:none;border-left:3px solid var(--amber);
    background:var(--surface);padding:16px 22px;font-size:0.86rem;color:var(--text-muted);
  }
  .note-row strong{color:var(--text);}
  .no-calc{padding:12px 22px;border-bottom:1px solid var(--surface-2);font-size:0.86rem;color:var(--text-muted);}
  .no-calc span{color:var(--text);}
  .no-calc .loc{display:block;font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);margin-top:2px;}

  .reset{margin-top:24px;font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);background:none;border:1px solid var(--border);padding:9px 16px;cursor:pointer;}
  .reset:hover{color:var(--text);border-color:var(--text-muted);}

  @media (max-width:560px){
    .choices{grid-template-columns:1fr;}
    .choices.two{grid-template-columns:1fr;}
    .calc-row{grid-template-columns:1fr;gap:4px;}
    .calc-row .arrow{display:none;}
  }
</style>
</head>
<body>

<header class="sg-topbar">
  <div class="sg-topbar-inner">
    <a class="brand" href="index.html">Christian Seitz</a>
    <a href="index.html">Home</a>
    <a href="setup-guide.html">Setup Guide</a>
    <a href="setup-rechner.html" class="active">Rechner</a>
  </div>
</header>

<div class="wrap">
  <div class="eyebrow"><span class="dot"></span> Setup-Rechner</div>
  <h1>Deine Werte rein — die Zielwerte raus.</h1>
  <p class="sub">Wähle Phase und Symptom, trag dann deine aktuellen Werte aus dem Setup-Screen ein — der Rechner zeigt dir direkt, wohin du gehen solltest.</p>

  <div class="step">
    <div class="step-label"><span class="n">1</span> Wann passiert es?</div>
    <div class="choices" id="phase-choices">
      <button class="choice" data-phase="entry"><span class="t">Einlenken</span><span class="d">unter Bremse</span></button>
      <button class="choice" data-phase="mid"><span class="t">Kurvenmitte</span><span class="d">neutrale Last</span></button>
      <button class="choice" data-phase="exit"><span class="t">Kurvenausgang</span><span class="d">unter Gas</span></button>
    </div>
  </div>

  <div class="step">
    <div class="step-label"><span class="n">2</span> Was macht das Auto?</div>
    <div class="choices two" id="symptom-choices">
      <button class="choice" data-symptom="under"><span class="t">Untersteuert</span><span class="d">schiebt</span></button>
      <button class="choice" data-symptom="over"><span class="t">Übersteuert</span><span class="d">bricht aus</span></button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="result-head" id="result-head">
      <h2 id="result-title"></h2>
    </div>
    <div class="calc-table" id="calc-table"></div>
    <div class="note-row" id="result-note"></div>
  </div>

  <button class="reset" id="reset-btn" style="display:none;">Neu starten</button>
</div>

<script>
// step ist der Delta-Wert, der auf den eingetragenen Ist-Wert addiert wird.
// calc:null = Hebel ohne eindeutige Vorzeichen-Konvention (z.B. Ramp-Winkel je nach Auto unterschiedlich) -> nur Hinweistext, kein Rechner-Feld.
const DATA = {
  entry: {
    under: {
      title: "Einlenk-Untersteuern — schiebt, dreht nicht ein",
      variant: "deny",
      items: [
        { label: "Bremsbalance (Front-Anteil)", where: "Chassis → Front (Brakes)", unit: "%", step: -0.4 },
        { label: "Front-ARB", where: "Chassis → Front", unit: "Position", step: -1 },
        { label: "Front-Camber", where: "Chassis → Front Corners", unit: "°", step: -0.25 },
        { label: "Front-Ride-Height", where: "Chassis → Front", unit: "mm", step: -0.25 },
        { label: "Front-LSC-Dämpfer", where: "Dampers", unit: "Klick", step: -1 },
        { label: "Heck-ARB", where: "Chassis → Rear", unit: "Position", step: 1 },
        { label: "Heck-Toe", where: "Chassis → Rear Corners", unit: "mm", step: -0.3 }
      ],
      textOnly: [{ label: "Coast Ramp öffnen (falls vorhanden)", where: "Gears / Differential", hint: "Richtung je nach Auto unterschiedlich — im Spiel gegenprüfen." }],
      note: "Wird oft mit dem Diff verwechselt — bei Autos ohne separate Coast Ramp greift hier vor allem die Bremsbalance, nicht das Preload."
    },
    over: {
      title: "Einlenk-Übersteuern — Gegenlenk-Schlag (Snap)",
      variant: "affirm",
      items: [
        { label: "Bremsbalance (Front-Anteil)", where: "Chassis → Front (Brakes)", unit: "%", step: 0.4 },
        { label: "Front-ARB", where: "Chassis → Front", unit: "Position", step: 1 },
        { label: "Front-Ride-Height", where: "Chassis → Front", unit: "mm", step: 0.25 },
        { label: "Front-LSC-Dämpfer", where: "Dampers", unit: "Klick", step: 1 },
        { label: "Heck-ARB", where: "Chassis → Rear", unit: "Position", step: -1 },
        { label: "Heck-Toe-in", where: "Chassis → Rear Corners", unit: "mm", step: 0.3 }
      ],
      textOnly: [
        { label: "Front-Toe Richtung neutral", where: "Chassis → Front Corners", hint: "Kleinerer Hebel — Vorzeichen hängt von der Toe-Konvention deines Autos ab." },
        { label: "Coast Ramp schließen (falls vorhanden)", where: "Gears / Differential", hint: "Richtung je nach Auto unterschiedlich — im Spiel gegenprüfen." }
      ],
      note: "Bevor du am Diff drehst: prüfen, ob das Auto auch beim reinen Geradeausbremsen schon unruhig ist, oder erst beim Einlenken unter Bremse."
    }
  },
  mid: {
    under: {
      title: "Kurvenmitte-Untersteuern — schiebt über die Vorderachse",
      variant: "deny",
      items: [
        { label: "Front-ARB", where: "Chassis → Front", unit: "Position", step: -1 },
        { label: "Front-Ride-Height", where: "Chassis → Front", unit: "mm", step: -0.25 },
        { label: "Heck-ARB", where: "Chassis → Rear", unit: "Position", step: 1 },
        { label: "Heck-Ride-Height", where: "Chassis → Rear", unit: "mm", step: 0.25 }
      ],
      textOnly: [{ label: "Front-Feder weicher (später Hebel)", where: "Chassis → Front Corners", hint: "Richtwert 10–20 N/mm weicher, je nach Ausgangs-Federrate." }],
      note: "Reifendruck ist hier kein Hebel — in iRacing steht der bei GT3 ohnehin auf Minimum."
    },
    over: {
      title: "Kurvenmitte-Übersteuern — Heck bricht ohne Gas/Bremse aus",
      variant: "affirm",
      items: [
        { label: "Front-ARB", where: "Chassis → Front", unit: "Position", step: 1 },
        { label: "Heck-ARB", where: "Chassis → Rear", unit: "Position", step: -1 },
        { label: "Heck-Camber", where: "Chassis → Rear Corners", unit: "°", step: 0.25 },
        { label: "Heck-Ride-Height", where: "Chassis → Rear", unit: "mm", step: -0.25 },
        { label: "Heck-LSC-Dämpfer", where: "Dampers", unit: "Klick", step: -1 }
      ],
      textOnly: [],
      note: "Das hier zuerst fixen, auch wenn Einlenken und Exit sich sonst gut anfühlen — ein Auto, das ohne Fahrereingabe dreht, verletzt die Grundphilosophie."
    }
  },
  exit: {
    under: {
      title: "Exit-Untersteuern — keine Traktion, läuft weit",
      variant: "deny",
      items: [
        { label: "Diff-Preload", where: "Gears / Differential", unit: "Nm", step: -10 },
        { label: "Friction Faces", where: "Gears / Differential", unit: "Faces", step: -2 },
        { label: "Heck-Ride-Height", where: "Chassis → Rear", unit: "mm", step: 0.25 },
        { label: "Heck-ARB", where: "Chassis → Rear", unit: "Position", step: -1 },
        { label: "Front-LSC-Dämpfer", where: "Dampers", unit: "Klick", step: -1 }
      ],
      textOnly: [{ label: "Power Ramp öffnen (falls vorhanden, statt Preload/Faces)", where: "Gears / Differential", hint: "Richtung je nach Auto unterschiedlich — im Spiel gegenprüfen." }],
      note: "Diff-Änderungen immer über mehrere Kurventypen gegenprüfen — eine Lockerung, die hier hilft, kann in einer anderen Kurve neues Power-Oversteer erzeugen."
    },
    over: {
      title: "Exit-Übersteuern — Power-Oversteer",
      variant: "affirm",
      items: [
        { label: "Diff-Preload", where: "Gears / Differential", unit: "Nm", step: 10 },
        { label: "Friction Faces", where: "Gears / Differential", unit: "Faces", step: 2 },
        { label: "Heck-Toe-in", where: "Chassis → Rear Corners", unit: "mm", step: 0.3 },
        { label: "Heck-Camber", where: "Chassis → Rear Corners", unit: "°", step: 0.25 },
        { label: "Heck-LSC-Dämpfer", where: "Dampers", unit: "Klick", step: 1 },
        { label: "Heck-Ride-Height", where: "Chassis → Rear", unit: "mm", step: -0.25 }
      ],
      textOnly: [
        { label: "Power Ramp erhöhen (falls vorhanden, statt Preload/Faces)", where: "Gears / Differential", hint: "Richtung je nach Auto unterschiedlich — im Spiel gegenprüfen." },
        { label: "TC-Stufe prüfen, falls Reglement erlaubt", where: "In-Car Dials", hint: "Meist 1 Stufe pro Test." }
      ],
      note: "Ein zu fest gesperrtes Diff kann in einer anderen Kurve Traktionsverlust oder Einlenk-Probleme erzeugen — nicht isoliert an der einen Stelle testen."
    }
  }
};

let phase = null, symptom = null;

function fmt(n){
  const r = Math.round(n * 100) / 100;
  return (r > 0 && n === r) ? "+" + r : String(r);
}

function render(){
  document.querySelectorAll('#phase-choices .choice').forEach(b => b.classList.toggle('active', b.dataset.phase === phase));
  document.querySelectorAll('#symptom-choices .choice').forEach(b => b.classList.toggle('active', b.dataset.symptom === symptom));

  const resultEl = document.getElementById('result');
  const resetBtn = document.getElementById('reset-btn');
  if(!phase || !symptom){ resultEl.classList.remove('show'); resetBtn.style.display = 'none'; return; }

  const entry = DATA[phase][symptom];
  const head = document.getElementById('result-head');
  head.className = 'result-head ' + entry.variant;
  document.getElementById('result-title').textContent = entry.title;

  const table = document.getElementById('calc-table');
  table.innerHTML = '';

  entry.items.forEach(function(it, idx){
    const row = document.createElement('div');
    row.className = 'calc-row';
    row.innerHTML =
      '<div class="lbl">' + it.label + '<span class="loc">' + it.where + ' · Schritt ' + fmt(it.step) + ' ' + it.unit + '</span></div>' +
      '<input type="number" step="any" inputmode="decimal" placeholder="Ist-Wert" data-idx="' + idx + '">' +
      '<div class="arrow">→</div>' +
      '<div class="out empty" id="out-' + idx + '">— <span class="unit">' + it.unit + '</span></div>';
    table.appendChild(row);

    const input = row.querySelector('input');
    const out = row.querySelector('#out-' + idx);
    input.addEventListener('input', function(){
      const v = parseFloat(input.value.replace(',', '.'));
      if(isNaN(v)){ out.className = 'out empty'; out.innerHTML = '— <span class="unit">' + it.unit + '</span>'; return; }
      out.className = 'out';
      out.innerHTML = (Math.round((v + it.step) * 100) / 100) + ' <span class="unit">' + it.unit + '</span>';
    });
  });

  (entry.textOnly || []).forEach(function(it){
    const row = document.createElement('div');
    row.className = 'no-calc';
    row.innerHTML = '<span>' + it.label + '</span><span class="loc">' + it.where + ' — ' + it.hint + '</span>';
    table.appendChild(row);
  });

  document.getElementById('result-note').innerHTML = '<strong>Dazu:</strong> ' + entry.note;

  resultEl.classList.add('show');
  resetBtn.style.display = 'inline-block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.getElementById('phase-choices').addEventListener('click', function(e){
  const btn = e.target.closest('.choice'); if(!btn) return;
  phase = btn.dataset.phase; render();
});
document.getElementById('symptom-choices').addEventListener('click', function(e){
  const btn = e.target.closest('.choice'); if(!btn) return;
  symptom = btn.dataset.symptom; render();
});
document.getElementById('reset-btn').addEventListener('click', function(){
  phase = null; symptom = null; render();
});
</script>

</body>
</html>
